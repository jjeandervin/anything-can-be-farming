<header>
  <div class="bar">
    <a class="brand" routerLink="/identify">Anything Can Be Farming</a>
    <div class="account">
      @if (!auth.ready()) {
        <span class="muted">Checking sign-in…</span>
      } @else if (auth.authenticated()) {
        <span class="who" [title]="auth.name()">Signed in as {{ auth.name() }}</span>
        <button type="button" class="link-button" (click)="auth.signOut()">Sign out</button>
      } @else {
        <button type="button" class="link-button" (click)="auth.signIn()">Sign in</button>
      }
    </div>
  </div>
  <nav aria-label="Main">
    <a routerLink="/identify" routerLinkActive="active" ariaCurrentWhenActive="page">Identify</a>
    <a routerLink="/status" routerLinkActive="active" ariaCurrentWhenActive="page">Status</a>
  </nav>
</header>
<main>
  <router-outlet />
</main>
